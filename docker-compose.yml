version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--db=dev-file"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
      KC_HOSTNAME: localhost
    ports:
      - "8081:8081"

    networks:
      - coord-net

  coordsvc:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - KEYCLOAK_URL=http://keycloak:8081/realms/measure
      - KEYCLOAK_ISSUER=http://keycloak:8081/realms/measure
      - KEYCLOAK_AUDIENCE=coord-service
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - coord-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  coord-net: {}
